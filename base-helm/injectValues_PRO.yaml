        ALERT_SNAPSHOT_UPSTREAM_BASE_URL: https://api-alertas-pro.sas.junta-andalucia.es/manager
        ALERT_DETAIL_UPSTREAM_BASE_URL: https://api-alertas-pro.sas.junta-andalucia.es/manager
