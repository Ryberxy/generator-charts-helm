global:
  nameSpace: oc_alert
  registry:
    dns: dml-si.sas.junta-andalucia.es:8084
    path: asistencial/gestion-centralizada-de-alertas-a-profesionales
  ingress:
    enabled: true
    gateway: alertas-gateway
    name: alertas-ingress
  developDeployment: false
ingress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
microservicio:
  spec:
    replicaCount: 1
    ingress:
      host: api-alertas-pro.sas.junta-andalucia.es
    usageSpec:
      low:
        resources:
          requests:
            cpu: 25m
            memory: 300Mi
          limits:
            cpu: 400m
            memory: 350Mi
      medium:
        resources:
          requests:
            cpu: 50m
            memory: 600Mi
          limits:
            cpu: 600m
            memory: 700Mi
      high:
        resources:
          requests:
            cpu: 50m
            memory: 400Mi
          limits:
            cpu: '1'
            memory: 800Mi
        autoscaling:
          minReplicas: 3
          maxReplicas: 5
          targetCPUUtilizationValue: 700m
          targetMemoryUtilizationValue: 600Mi
    service:
      port: 9080
      sas_monitoring: true
      metricsPath: /metrics
    container:
      port: 9080
    corsPolicy:
      allowCredentials: true
      allowHeaders:
      - '*'
      allowOrigins:
      - exact: '*'
      allowMethods:
      - GET
      - POST
      - OPTIONS
      - HEAD
      - PUT
      - DELETE
    environment:
      configMap: {}
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 9080
      initialDelaySeconds: 60
      timeoutSeconds: 30
      periodSeconds: 60
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /health/live
        port: 9080
      initialDelaySeconds: 60
      timeoutSeconds: 30
      periodSeconds: 60
front:
  spec:
    replicaCount: 1
    ingress:
      host: alertas-front-pro.sas.junta-andalucia.es
    service:
      port: 8080
    container:
      port: 8080
    usageSpec:
      low:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
configMapFront: {}
projects:
- configFile: projects/catalogo-de-alertas-api.yaml
  spec:
    type: microservicio
    imageTag: PENDIENTE_TAG_ALERT_CCA_GESTORCATALOGOALERTAS_MSC_PRO
    environment:
      secrets:
        DB_URL: PENDIENTE_DB_URL_CCA_PRO
        DB_DEFAULT_SCHEMA: OWN_ALERTAS_CCA_PRO
        DB_USER: APP_ALERTAS_CCA_PRO
        DB_PASSWORD: PENDIENTE_DB_PASSWORD_CCA_PRO
        ltpa_keys_password: PENDIENTE_LTPA_KEYS_PASSWORD_PRO
      configMap:
        CORS_ALLOWED_ORIGINS: https://alertas-front-pro.sas.junta-andalucia.es
- configFile: projects/alertas-profesional-bff.yaml
  spec:
    type: microservicio
    imageTag: PENDIENTE_TAG_ALERT_EAL_USUARIOALERTBFF_MSC_PRO
    environment:
