spec:
  name: motor-evaluador-hechos
  version: 1.0.0
  image:
    pullPolicy: IfNotPresent
    name: motor-evaluador-hechos
  replicaCount: 1
  usage_level: low
  autoscaling:
    enabled: false
  service:
    sas_monitoring: false
  container:
    port: 9081
  authentication:
    enabled: false
  trafficManagement:
    ruleSet:
    - name: route-to-health
      prefix: /evaluacionhechoalerta/health
      urlRewrite: /health
    - name: route-to-jwt
      prefix: /evaluacionhechoalerta/jwt
      urlRewrite: /jwt
    - name: route-to-openapi
      prefix: /evaluacionhechoalerta/openapi
      urlRewrite: /openapi
    - name: route-to-openapi-ui
      prefix: /evaluacionhechoalerta/openapi/ui
      urlRewrite: /openapi/ui
    - name: route-to-metrics
      prefix: /evaluacionhechoalerta/metrics
      urlRewrite: /metrics
    - name: route-to-ibm-api
      prefix: /evaluacionhechoalerta/ibm/api
      urlRewrite: /ibm/api
    - name: route-to-api
      prefix: /evaluacionhechoalerta/api
      urlRewrite: /evaluacionhechoalerta/api
      corsPolicy:
        allowCredentials: true
        allowHeaders:
        - '*'
        allowOrigins:
        - exact: '*'
        allowMethods:
        - GET
        - POST
        - OPTIONS
        - HEAD
        - PUT
        - DELETE
        maxAge: 5m
  authorization:
    enabled: false
  kafka:
    enable: true
  environment:
    configMap:
      EVALUABLE_ALERT_FACT_TOPIC: alertas.hecho-evaluable
      EVALUATE_ALERT_EVENT_TOPIC: alertas.evaluacion
      CCA_CONNECT_TIMEOUT: 2000
      CCA_READ_TIMEOUT: 4000
      GEV_CONNECT_TIMEOUT: 2000
      GEV_READ_TIMEOUT: 4000
