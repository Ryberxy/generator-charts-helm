spec:
  name: gestor-estados-alerta-profesional-api
  version: 1.0.0
  image:
    pullPolicy: IfNotPresent
    name: gestor-estados-alerta-profesional-api
  replicaCount: 1
  usage_level: low
  autoscaling:
    enabled: false
  service:
    sas_monitoring: false
  container:
    port: 9088
  authentication:
    enabled: false
  trafficManagement:
    ruleSet:
    - name: route-to-health
      prefix: /manager/health
      urlRewrite: /health
    - name: route-to-openapi-ui
      prefix: /manager/openapi/ui
      urlRewrite: /openapi/ui
    - name: route-to-jwt
      prefix: /manager/jwt
      urlRewrite: /jwt
    - name: route-to-openapi
      prefix: /manager/openapi
      urlRewrite: /openapi
    - name: route-to-metrics
      prefix: /manager/metrics
      urlRewrite: /metrics
    - name: route-to-ibm-api
      prefix: /manager/ibm/api
      urlRewrite: /ibm/api
    - name: route-to-api
      prefix: /manager/api
      urlRewrite: /manager/api
      corsPolicy:
        allowCredentials: true
        allowHeaders:
        - '*'
        allowOrigins:
        - exact: '*'
        allowMethods:
        - GET
        - POST
        - OPTIONS
        - HEAD
        - PUT
        - DELETE
        maxAge: 5m
  authorization:
    enabled: false
  kafka:
    enable: true
  environment:
    configMap:
      KAFKA_INCOMING_ALERT_UPDATED_EVENT_TOPIC: alertas.actualizada
      KAFKA_INCOMING_ALERT_UPDATED_EVENT_GROUP_ID: alert-eap-manager-msc-alert-updated-consumer
      KAFKA_OUTGOING_USER_ALERT_DELIVERY_TOPIC: alertas.userAlert
      MANAGER_OUTBOX_BATCH_SIZE: 100
      MANAGER_OUTBOX_MAX_ATTEMPTS: 10
      MANAGER_OUTBOX_INITIAL_BACKOFF_SECONDS: 5
      MANAGER_OUTBOX_MAX_BACKOFF_SECONDS: 300
      MANAGER_OUTBOX_BACKOFF_MULTIPLIER: 2
      MANAGER_OUTBOX_PUBLISHED_RETENTION_HOURS: 24
      MANAGER_OUTBOX_FAILED_RETENTION_DAYS: 7
      ALERT_EVALUATOR_UPSTREAM_PREPARE_BY_USER_PATH: /api/internal/evaluator/user-alert/evaluate-by-user
      ALERT_EVALUATOR_UPSTREAM_DETAIL_PATH: /api/internal/evaluator/user-alert/details
      ALERT_EVALUATOR_UPSTREAM_EVALUATE_BY_ALERT_PATH: /api/internal/evaluator/user-alert/evaluate-by-alert
      ALERT_EVALUATOR_UPSTREAM_TIMEOUT_MS: 10000
      ALERT_PROJECTION_UPSTREAM_PERSIST_PATH: /api/internal/alert-projections
      ALERT_PROJECTION_UPSTREAM_TIMEOUT_MS: 10000
      ALERT_SNAPSHOT_UPSTREAM_PATH: /api/internal/snapshot/request
      ALERT_SNAPSHOT_UPSTREAM_TIMEOUT_MS: 10000
