spec:
  name: motor-evaluacion-eventos
  version: 1.0.0
  image:
    pullPolicy: IfNotPresent
    name: motor-evaluacion-eventos
  replicaCount: 1
  usage_level: low
  autoscaling:
    enabled: false
  service:
    sas_monitoring: false
  container:
    port: 9083
  authentication:
    enabled: false
  trafficManagement:
    ruleSet:
    - name: route-to-health
      prefix: /evaluacondicionesposiblesalerta/health
      urlRewrite: /health
    - name: route-to-openapi-ui
      prefix: /evaluacondicionesposiblesalerta/openapi/ui
      urlRewrite: /openapi/ui
    - name: route-to-jwt
      prefix: /evaluacondicionesposiblesalerta/jwt
      urlRewrite: /jwt
    - name: route-to-openapi
      prefix: /evaluacondicionesposiblesalerta/openapi
      urlRewrite: /openapi
    - name: route-to-metrics
      prefix: /evaluacondicionesposiblesalerta/metrics
      urlRewrite: /metrics
    - name: route-to-ibm-api
      prefix: /evaluacondicionesposiblesalerta/ibm/api
      urlRewrite: /ibm/api
    - name: route-to-api
      prefix: /evaluacondicionesposiblesalerta/api
      urlRewrite: /evaluacondicionesposiblesalerta/api
      corsPolicy:
        allowCredentials: true
        allowHeaders:
        - '*'
        allowOrigins:
        - exact: '*'
        allowMethods:
        - GET
        - POST
        - OPTIONS
        - HEAD
        - PUT
        - DELETE
        maxAge: 5m
  authorization:
    enabled: false
  kafka:
    enable: true
  environment:
    configMap:
      KAFKA_OUTGOING_POSSIBLE_ALERT_EVALUATED_EVENT_TOPIC: alertas.evaluacion-posible
      KAFKA_INCOMING_NEW_ALERT_EVENT_TOPIC: alertas.evento
