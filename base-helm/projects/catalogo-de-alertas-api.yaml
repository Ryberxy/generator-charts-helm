spec:
  name: catalogo-de-alertas-api
  version: 1.0.0
  image:
    pullPolicy: IfNotPresent
    name: catalogo-de-alertas-api
  replicaCount: 1
  usage_level: low
  autoscaling:
    enabled: false
  service:
    sas_monitoring: true
    metricsPath: /metrics
  container:
    port: 9082
  authentication:
    enabled: false
  trafficManagement:
    ruleSet:
    - name: route-to-health
      prefix: /gestorcatalogoalertas/health
      urlRewrite: /health
    - name: route-to-openapi-ui
      prefix: /gestorcatalogoalertas/openapi/ui
      urlRewrite: /openapi/ui
    - name: route-to-jwt
      prefix: /gestorcatalogoalertas/jwt
      urlRewrite: /jwt
    - name: route-to-openapi
      prefix: /gestorcatalogoalertas/openapi
      urlRewrite: /openapi
    - name: route-to-metrics
      prefix: /gestorcatalogoalertas/metrics
      urlRewrite: /metrics
    - name: route-to-ibm-api
      prefix: /gestorcatalogoalertas/ibm/api
      urlRewrite: /ibm/api
    - name: route-to-api
      prefix: /gestorcatalogoalertas/api
      urlRewrite: /gestorcatalogoalertas/api
      corsPolicy:
        allowCredentials: true
        allowHeaders:
        - '*'
        allowOrigins:
        - exact: '*'
        allowMethods:
        - GET
        - POST
        - OPTIONS
        - HEAD
        - PUT
        - DELETE
        maxAge: 5m
  authorization:
    enabled: false
  kafka:
    enable: true
  environment:
    configMap:
      ALERT_TYPE_PASSIVATED_TOPIC: alertas.tipo-alerta-pasivada
      CCA_ALERT_TYPE_PASSIVATED_OUTBOX_RELAY_SECONDS: "30"
