spec:
  name: gestor-cdv-alertas
  version: 1.0.0
  image:
    pullPolicy: IfNotPresent
    name: gestor-cdv-alertas
  replicaCount: 1
  usage_level: low
  autoscaling:
    enabled: false
  service:
    sas_monitoring: false
  container:
    port: 9090
  authentication:
    enabled: false
  trafficManagement:
    ruleSet:
    - name: route-to-health
      prefix: /gestorestadoversionado/health
      urlRewrite: /health
    - name: route-to-openapi-ui
      prefix: /gestorestadoversionado/openapi/ui
      urlRewrite: /openapi/ui
    - name: route-to-jwt
      prefix: /gestorestadoversionado/jwt
      urlRewrite: /jwt
    - name: route-to-openapi
      prefix: /gestorestadoversionado/openapi
      urlRewrite: /openapi
    - name: route-to-metrics
      prefix: /gestorestadoversionado/metrics
      urlRewrite: /metrics
    - name: route-to-ibm-api
      prefix: /gestorestadoversionado/ibm/api
      urlRewrite: /ibm/api
    - name: route-to-api
      prefix: /gestorestadoversionado/api
      urlRewrite: /gestorestadoversionado/api
      corsPolicy:
        allowCredentials: true
        allowHeaders:
        - '*'
        allowOrigins:
        - exact: '*'
        allowMethods:
        - GET
        - POST
        - OPTIONS
        - HEAD
        - PUT
        - DELETE
        maxAge: 5m
  authorization:
    enabled: false
  kafka:
    enable: true
  environment:
    configMap:
      KAFKA_INCOMING_EVALUATE_ALERT_EVENT_TOPIC: alertas.evaluacion
      KAFKA_INCOMING_EVALUATE_ALERT_EVENT_GROUP_ID: alert-gev-gestor-estado-versionado
      KAFKA_INCOMING_ALERT_TYPE_PASSIVATED_TOPIC: alertas.tipo-alerta-pasivada
      KAFKA_INCOMING_ALERT_TYPE_PASSIVATED_GROUP_ID: alert-gev-alert-type-passivation
      KAFKA_OUTGOING_ALERT_UPDATED_EVENT_TOPIC: alertas.actualizada
      ALERT_TYPE_PASSIVATION_BATCH_SIZE: "100"
