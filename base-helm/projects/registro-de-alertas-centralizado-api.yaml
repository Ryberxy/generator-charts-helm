spec:
  name: registro-de-alertas-centralizado-api
  version: "1.0.0"
  image:
    pullPolicy: IfNotPresent
    name: registro-de-alertas-centralizado-api
  replicaCount: 1
  usage_level: low
  autoscaling:
    enabled: false
  service:
    sas_monitoring: true
    metricsPath: /metrics
  container:
    port: 9089
  authentication:
    enabled: false
  trafficManagement:
    ruleSet:
    - name: route-to-health
      prefix: /consultaalertas/health
      urlRewrite: /health
    - name: route-to-openapi-ui
      prefix: /consultaalertas/openapi/ui
      urlRewrite: /openapi/ui
    - name: route-to-jwt
      prefix: /consultaalertas/jwt
      urlRewrite: /jwt
    - name: route-to-openapi
      prefix: /consultaalertas/openapi
      urlRewrite: /openapi
    - name: route-to-metrics
      prefix: /consultaalertas/metrics
      urlRewrite: /metrics
    - name: route-to-ibm-api
      prefix: /consultaalertas/ibm/api
      urlRewrite: /ibm/api
    - name: route-to-api
      prefix: /consultaalertas/api
      urlRewrite: /consultaalertas/api
      corsPolicy:
        allowCredentials: true
        allowHeaders:
        - '*'
        allowOrigins:
        - exact: '*'
        allowMethods:
        - GET
        - POST
        - OPTIONS
        - HEAD
        - PUT
        - DELETE
        maxAge: 5m
  authorization:
    enabled: false
  environment:
